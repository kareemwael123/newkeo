<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keo.AI — تحت الصيانة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0D0C'/%3E%3Crect x='6' y='8' width='20' height='16' rx='8' fill='%23C6F24B'/%3E%3Crect x='11' y='13' width='3' height='7' rx='1.5' fill='%230B0D0C'/%3E%3Crect x='18' y='13' width='3' height='7' rx='1.5' fill='%230B0D0C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ================== BASE (same identity as Keo.AI) ================== */
:root{
  --bg:#0B0D0C; --panel:#101312; --panel2:#151917; --line:rgba(235,240,225,.09);
  --text:#EDEFE6; --mut:#9BA398; --acc:#C6F24B; --acc-ink:#161d04; --err:#FF6B57;
  --f:'Space Grotesk','Tajawal',sans-serif; --fd:'Unbounded','Tajawal',sans-serif;
  --fa:'Tajawal',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--f);
  overflow:hidden;
  background-image:radial-gradient(rgba(235,240,225,.045) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#232823;border-radius:9px;border:2px solid var(--bg)}

/* ================== maintenance stage ================== */
#stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto;
}
.gate-inner{
  display:grid;grid-template-columns:340px 1fr;gap:60px;align-items:center;
  max-width:1000px;width:100%;
  animation:up .6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* bot */
#gateBot{width:340px;justify-self:center}
.bot svg{display:block;overflow:visible;width:100%}
.b-shadow{fill:rgba(0,0,0,.42);transform-box:fill-box;transform-origin:center;animation:bsh 3.2s ease-in-out infinite}
@keyframes bsh{0%,100%{transform:scaleX(1);opacity:.42}50%{transform:scaleX(.85);opacity:.26}}
.b-bot{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.b-ant line{stroke:#C9C2B1;stroke-width:4;stroke-linecap:round}
.b-antlight{fill:var(--acc);transform-box:fill-box;transform-origin:center;animation:antp 1.7s ease-in-out infinite}
@keyframes antp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.5}}
.b-head{transform-box:view-box;transform-origin:160px 148px;transition:transform .45s}
.bot.think .b-head{transform:rotate(-5deg)}
.b-headshape,.b-body{fill:#E9E3D4}
.b-ear,.b-neck,.b-foot{fill:#C9C2B1}
.b-visor,.b-chest{fill:#0E1211}
.b-led{fill:var(--acc);animation:dotp 1.6s infinite}
@keyframes dotp{50%{opacity:.25;transform:scale(.7)}}
.b-bar{fill:#39443a}
.b-eye{fill:var(--acc);opacity:1;transform-box:fill-box;transform-origin:center;transition:transform .12s,opacity .2s}
.bot.blink .b-eye{transform:scaleY(.1)}
.b-eyes{transition:transform .4s;transform-box:view-box}
.bot.think .b-eyes{transform:translateY(-5px)}
.b-think{opacity:0}
.b-think circle{fill:#E9E3D4;transform-box:fill-box;transform-origin:center}
.bot.think .b-think{opacity:1}
.bot.think .b-think circle{animation:tdot 1.5s infinite}
.bot.think .b-think circle:nth-child(2){animation-delay:.2s}
.bot.think .b-think circle:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{opacity:.15;transform:translateY(3px)}50%{opacity:1;transform:translateY(-2px)}}
.b-arm{transform-box:view-box;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.b-arm rect{fill:#D8D1BF}
.b-arm circle{fill:#EFEAD9}
.b-armL{transform-origin:115px 160px;transform:rotate(12deg)}
.b-armR{transform-origin:205px 160px;transform:rotate(-12deg)}

/* text column */
.brand-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.gate-name{font-family:var(--fd);font-weight:900;font-size:88px;line-height:1.05;letter-spacing:-1px}
.gate-name i{font-style:normal;color:var(--acc)}
.gate-latin{letter-spacing:9px;font-size:13px;color:var(--acc);margin:6px 0 22px;font-weight:600}

.kicker{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--f);font-size:11px;letter-spacing:4px;color:var(--acc);
  font-weight:600;margin-bottom:18px;
  padding:7px 14px;border:1px solid rgba(198,242,75,.28);border-radius:999px;
  background:rgba(198,242,75,.06);
}
.kicker .capDot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:dotp 1.2s infinite;flex-shrink:0}

.gate-h{
  font-family:var(--fa);font-weight:800;font-size:42px;line-height:1.25;
  margin-bottom:14px;color:var(--text);
}
.gate-h .hl{color:var(--acc)}
.gate-tag{
  color:var(--mut);font-family:var(--fa);font-size:17px;line-height:1.85;
  max-width:520px;margin-bottom:26px;font-weight:400;
}

/* status pill */
.status{
  display:inline-flex;align-items:center;gap:11px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:11px 18px;font-size:14px;color:#cfd4c6;font-family:var(--f);
  margin-bottom:24px;max-width:520px;
}
.status .capDot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:dotp 1.2s infinite;flex-shrink:0}
.status .lbl{color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-inline-end:4px}
.status .val{color:var(--text);font-weight:600}

/* progress bar */
.prog{
  max-width:520px;width:100%;margin-bottom:30px;
}
.prog-track{
  height:6px;border-radius:6px;background:var(--panel);border:1px solid var(--line);overflow:hidden;
}
.prog-fill{
  height:100%;width:40%;border-radius:6px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);
  background-size:200% 100%;
  animation:slide 2.2s linear infinite;
}
@keyframes slide{0%{background-position:200% 0}100%{background-position:-200% 0}}
.prog-row{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--mut);font-family:var(--f)}
.prog-row b{color:var(--acc);font-weight:600}

/* actions / social */
.gate-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:12px;font-size:14.5px;font-weight:600;transition:.2s;border:1px solid transparent;font-family:var(--f)}
.btn-line{border-color:var(--line);color:var(--text);background:rgba(16,19,18,.4)}
.btn-line:hover{background:var(--panel2);border-color:rgba(198,242,75,.4)}
.btn-line svg{width:17px;height:17px;color:var(--acc)}

.gate-credit{margin-top:28px;font-size:13px;color:var(--mut);font-family:var(--f)}
.gate-credit b{color:var(--text);font-weight:600}

/* ================== responsive ================== */
@media (max-width:820px){
  .gate-inner{grid-template-columns:1fr;gap:24px;max-width:480px;text-align:center}
  #gateBot{width:230px;margin:0 auto}
  .gate-name{font-size:64px}
  .gate-latin{margin:4px 0 18px}
  .kicker{margin-inline:auto}
  .gate-h{font-size:30px}
  .gate-tag{font-size:15px;margin-inline:auto}
  .status{margin-inline:auto;text-align:start;justify-content:center}
  .prog{margin-inline:auto}
  .gate-actions{justify-content:center}
  .gate-credit{margin-top:22px}
}
@media (max-width:420px){
  .gate-name{font-size:52px}
  .gate-h{font-size:26px}
  #gateBot{width:190px}
}
</style>
</head>
<body>

<div id="stage">
  <div class="gate-inner">
    <div id="gateBot" class="bot think"></div>
    <div>
      <h1 class="gate-name">Keo<i>.</i>AI</h1>
      <div class="gate-latin">KEO AI</div>

      <span class="kicker"><span class="capDot"></span>UNDER MAINTENANCE</span>

      <h2 class="gate-h">كيو <span class="hl">تحت الصيانة</span> دلوقتي</h2>
      <p class="gate-tag">شوية تحديثات وكملت. كيو بيجهّز نسخة أقوى وأسرع — هيرجعلك قريب أوي. ابقى قاعد.</p>

      <div class="status">
        <span class="capDot"></span>
        <span class="lbl">Status:</span>
        <span class="val">Keo is upgrading his systems…</span>
      </div>

      <div class="prog">
        <div class="prog-track"><div class="prog-fill"></div></div>
        <div class="prog-row"><span>Be right back</span><b>soon ٪</b></div>
      </div>

      <div class="gate-actions">
        <a class="btn btn-line" href="mailto:kareemwael0213@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg>
          راسلنا
        </a>
        <a class="btn btn-line" href="https://keoai.online" id="btnRetry">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg>
          جرّب تاني
        </a>
      </div>

      <p class="gate-credit">Built by <b>Kareem Hussein</b></p>
    </div>
  </div>
</div>

<script>
/* ====== Keo bot SVG (same as original) ====== */
function botSVG(){ return `
<svg viewBox="0 0 320 270" aria-hidden="true">
  <ellipse class="b-shadow" cx="160" cy="252" rx="66" ry="9"/>
  <g class="b-bot">
    <g class="b-ant"><line x1="160" y1="60" x2="160" y2="36"/><circle class="b-antlight" cx="160" cy="30" r="6"/></g>
    <g class="b-head">
      <rect class="b-ear" x="88" y="92" width="12" height="24" rx="5"/><rect class="b-ear" x="220" y="92" width="12" height="24" rx="5"/>
      <rect class="b-headshape" x="98" y="58" width="124" height="90" rx="34"/>
      <rect class="b-visor" x="110" y="78" width="100" height="50" rx="24"/>
      <g class="b-eyes">
        <rect class="b-eye" x="133" y="89" width="11" height="24" rx="5.5"/><rect class="b-eye" x="176" y="89" width="11" height="24" rx="5.5"/>
      </g>
    </g>
    <rect class="b-neck" x="149" y="142" width="22" height="16" rx="6"/>
    <rect class="b-body" x="112" y="152" width="96" height="78" rx="30"/>
    <rect class="b-chest" x="135" y="172" width="50" height="32" rx="9"/>
    <circle class="b-led" cx="150" cy="188" r="4.5"/>
    <rect class="b-bar" x="161" y="180" width="16" height="5" rx="2.5"/>
    <rect class="b-bar" x="161" y="189" width="11" height="5" rx="2.5"/>
    <rect class="b-foot" x="126" y="224" width="27" height="14" rx="7"/><rect class="b-foot" x="167" y="224" width="27" height="14" rx="7"/>
    <g class="b-arm b-armL"><rect x="108" y="156" width="14" height="50" rx="7"/><circle cx="115" cy="209" r="8.5"/></g>
    <g class="b-arm b-armR"><rect x="198" y="156" width="14" height="50" rx="7"/><circle cx="205" cy="209" r="8.5"/></g>
    <g class="b-think"><circle cx="213" cy="46" r="4"/><circle cx="227" cy="34" r="6"/><circle cx="244" cy="20" r="8"/></g>

const botEl = document.getElementById('gateBot');
botEl.innerHTML = botSVG();

/* periodic blink — feels alive */
function blink(){
  botEl.classList.add('blink');
  setTimeout(()=>botEl.classList.remove('blink'), 130);
}
blink();
setInterval(()=>{ blink(); }, 2600 + Math.random()*2400);

/* "retry" reloads the page (so when the site is back, user can re-check) */
document.getElementById('btnRetry').addEventListener('click', (e)=>{
  e.preventDefault();
  location.reload();
});
</script>
</body>
</html>
