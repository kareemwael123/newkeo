<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeoAI — Under Maintenance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0D0C'/%3E%3Crect x='6' y='8' width='20' height='16' rx='8' fill='%23C6F24B'/%3E%3Crect x='11' y='13' width='3' height='7' rx='1.5' fill='%230B0D0C'/%3E%3Crect x='18' y='13' width='3' height='7' rx='1.5' fill='%230B0D0C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0B0D0C;
  background-image:radial-gradient(rgba(235,240,225,.05) 1px,transparent 1px);
  background-size:26px 26px;
  color:#EDEFE6;
  font-family:'Space Grotesk',sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;overflow:hidden
}
.wrap{text-align:center;max-width:640px}
.gear{
  width:96px;height:96px;margin:0 auto 30px;border-radius:26px;
  background:#C6F24B;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 60px rgba(198,242,75,.25);
  animation:spin 6s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.gear svg{width:52px;height:52px}
h1{
  font-family:'Unbounded',sans-serif;
  font-weight:900;
  font-size:clamp(52px,11vw,110px);
  line-height:.95;
  letter-spacing:-1px;
  margin:0 0 14px
}
h1 .d{color:#C6F24B}
h2{
  font-family:'Unbounded',sans-serif;
  font-weight:700;
  font-size:clamp(18px,3.4vw,28px);
  color:#C6F24B;
  letter-spacing:2px;
  text-transform:uppercase;
  margin:0 0 20px
}
p{color:#9BA398;font-size:16.5px;line-height:1.9;margin:0 auto 34px;max-width:460px}
.status{
  display:inline-flex;align-items:center;gap:10px;
  border:1px solid rgba(235,240,225,.09);border-radius:999px;
  padding:10px 22px;font-size:13px;color:#9BA398;background:#101312
}
.dot{width:9px;height:9px;border-radius:50%;background:#C6F24B;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.brand{margin-top:44px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;letter-spacing:3px;color:#6B7266}
.brand b{color:#C6F24B}
@media(max-width:500px){ .gear{width:72px;height:72px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="gear">
    <svg viewBox="0 0 24 24" fill="none" stroke="#161d04" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </div>

  <h1>Maintenance<span class="d">.</span></h1>
  <h2>KEOAI IS UNDER MAINTENANCE</h2>
  <p>Keo is getting a powerful upgrade behind the scenes. The site will be back online very soon — bigger, faster, and sharper than ever. Thank you for your patience.</p>

  <div class="status"><span class="dot"></span> Status: maintenance in progress</div>

  <div class="brand">KEO<b>AI</b> · by Kareem Hussein</div>
</div>
</body>
</html>
